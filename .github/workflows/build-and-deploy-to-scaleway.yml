# This is a basic workflow to help you get started with Actions

name: Build & Deploy to Scaleway

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "staging","production" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
env:
  CONTAINER_ID: ${{ github.ref_name == 'staging' && vars.SCALEWAY_CONTAINER_ID_WEBSITE_STAGING || vars.SCALEWAY_CONTAINER_ID_WEBSITE_PRODUCTION }}


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - uses: actions/checkout@v3
    - name: Login to Scaleway Container Registry
      uses: docker/login-action@v2
      with:
        username: nologin
        password: ${{ secrets.SCALEWAY_SECRET_KEY }}
        registry: ${{ vars.CONTAINER_REGISTRY_ENDPOINT }}
    - name: Build the Docker image
      run: docker build . -t ${{ vars.CONTAINER_REGISTRY_ENDPOINT }}/webio-backend:$GITHUB_REF_NAME
    - name: Push the Docker Image
      run: docker push ${{ vars.CONTAINER_REGISTRY_ENDPOINT }}/webio-backend:$GITHUB_REF_NAME
    - name: Install scaleway/action cli
      uses: scaleway/action-scw@v0
      with:
        version: v2.32.1
    - run: scw container container deploy ${{ env.CONTAINER_ID }} region=nl-ams
      env:
        SCW_ACCESS_KEY: ${{ secrets.SCALEWAY_ACCESS_KEY }}
        SCW_SECRET_KEY: ${{ secrets.SCALEWAY_SECRET_KEY }}
        SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCALEWAY_ORGANIZATION_ID }}
